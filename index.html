<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/style.css" />
    <script src="js/app.js" defer type="module"></script>
    <title>WhatsApp Web</title>
  </head>
  <body>
    <nav>
      <div class="container-nav">
        <img id="icone-msg" src="./assets/icons/messages.svg" alt="" />
        <img src="./assets/icons/status.svg" alt="" />
        <img src="./assets/icons/newsletter.svg" alt="" />
        <img src="./assets/icons/community.svg" alt="" />
      </div>
      <div class="container-nav">
        <img src="./assets/icons/settings.svg" alt="" />
        <img id="secao-perfil" src="https://i.pravatar.cc/150?img=60" alt="" />
      </div>
    </nav>
    <section class="section">
      <div class="container-topo-conversas">
        <div class="container-titulo">
          <div class="titulo">
            <h1>WhatsApp</h1>
          </div>
          <div class="atalho-itens">
            <img src="./assets/icons/new-chat.svg" alt="" />
            <img src="./assets/icons/more-settings.svg" alt="" />
          </div>
        </div>
        <div class="container-input">
          <form action="">
            <input
              type="text"
              placeholder="Pesquisar ou começar uma nova conversa"
            />
          </form>
        </div>
        <div class="container-filtros">
          <button>Tudo</button>
          <button>Não lidas</button>
          <button>Favoritas</button>
          <button>Grupos</button>
        </div>
      </div>
      <div class="container-mensagens">
        
      </div>
    </section>
    <section class="container_perfil ocultar">
      <div class="titulo">
        <h1>Perfil</h1>
      </div>
      <div class="img-perfil">
        <img src="https://i.pravatar.cc/150?img=2" alt="">
      </div>
      <div class="container_informacoes">
        <div class="nome_perfil informacao">
          <p class="rotulo-informacao">Nome:</p>
          <p class="valor-informacao">Ricardo Silva</p>
        </div>
        <div class="recado_perfil informacao">
          <p class="rotulo-informacao">Recado</p>
          <p class="valor-informacao">Disponivel</p>
        </div>
        <div class="telefone_perfil informacao">
          <p class="rotulo-informacao">Telefone</p>
          <div class="valor-informacao-tel">
          <img src="assets/icons/phone.svg" alt="">
          <p class="numero-tel">+55 11 94554-9675</p>
          <img src="assets/icons/copy-btn.svg" alt="">
          </div>
        </div>
      </div>
      <div class="escolha_perfil">
        <p>Escolha Perfil</p>
        <div class="container_perfis_secundarios">
          <div class="container-contas">
            <img class="foto-perfil" src="https://i.pravatar.cc/150?img=10" alt="">
            <p class="nick-conta">Ricky</p>
          </div>
          <div class="container-contas">
            <img class="foto-perfil" src="https://i.pravatar.cc/150?img=10" alt="">
            <p class="nick-conta">BeeR</p>
          </div>
          <div class="container-contas">
            <img class="foto-perfil" src="https://i.pravatar.cc/150?img=10" alt="">
            <p class="nick-conta">Sand</p>
          </div>
          <div class="container-contas">
            <img class="foto-perfil" src="https://i.pravatar.cc/150?img=10" alt="">
            <p class="nick-conta">Joe</p>
          </div>
        </div>
      </div>
    </section>
    <main>
      <header class="container-topo-mensagens">
        <div class="fotoNome">
          <img
            class="foto-perfil"
            src="https://i.pravatar.cc/150?img=10"
            alt=""
          />
          <h2>Nome</h2>
        </div>
        <div class="iconesMSG">
          <img src="assets/icons/video-cam.svg" alt="" />
          <img src="assets/icons/down-menu.svg" alt="" />
          <img src="assets/icons/more-settings.svg" alt="" />
        </div>
      </header>
      <div class="grid-msg">
        
      </div>
      <form class="campo-texto">
        <input type="text" placeholder="Digite uma mensagem" />
      </form>
    </main>
  </body>
</html>
